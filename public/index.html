<!DOCTYPE html>
<html>

<head>
    <title>Multi-Chat Widget</title>
    <link id="theme-link" rel="stylesheet" href="/themes/dark-pill.css">

    <link rel="stylesheet" href="/css/app.css">
</head>

<body class="mode-widget">
    <div id="toast-container"></div>

    <div id="setup-modal">
        <div class="setup-box">
            <h2 style="margin-top:0; color:#9146FF;">Welcome to Multi-Chat!</h2>
            <p style="font-size: 14px; color: #adadb8;">Connect your streams to get started. You can change these later.
            </p>
            <div class="stream-input-group">
                <label>Twitch Username</label>
                <input type="text" id="setup-twitch" placeholder="e.g. jugachi">
            </div>
            <div class="stream-input-group">
                <label>YouTube (Channel ID or Live URL)</label>
                <input type="text" id="setup-youtube" placeholder="UC... or https://youtu.be/...">
            </div>
            <div class="stream-input-group">
                <label>Kick Username</label>
                <input type="text" id="setup-kick" placeholder="e.g. jugachi">
            </div>
            <div class="stream-input-group">
                <label>TikTok Username</label>
                <input type="text" id="setup-tiktok" placeholder="e.g. @jugachi">
            </div>
            <button class="action-btn" id="setup-btn">Connect & Save</button>
        </div>
    </div>

    <div id="settings-menu">
        <h3>Widget Settings</h3>
        <details class="settings-section" data-section="streams">
            <summary>Streams</summary>
            <div class="settings-section-body">
                <div class="stream-input-group">
                    <label style="font-size:12px; color:#9146FF; font-weight:bold;">Active Twitch</label>
                    <input type="text" id="menu-twitch" placeholder="Username">
                </div>
                <div class="stream-input-group">
                    <label style="font-size:12px; color:#FF0000; font-weight:bold;">Active YouTube</label>
                    <input type="text" id="menu-youtube" placeholder="Channel ID or Live URL">
                </div>
                <div class="stream-input-group">
                    <label style="font-size:12px; color:#53FC18; font-weight:bold;">Active Kick</label>
                    <input type="text" id="menu-kick" placeholder="Username">
                </div>
                <div class="stream-input-group">
                    <label style="font-size:12px; color:#FF0050; font-weight:bold;">Active TikTok</label>
                    <input type="text" id="menu-tiktok" placeholder="@username">
                </div>
                <button class="action-btn" id="menu-connect-btn" style="padding: 8px;">Switch Streams</button>
            </div>
        </details>
        <details class="settings-section" data-section="display" open>
            <summary>Display</summary>
            <div class="settings-section-body">
                <div class="setting-row">
                    <label>Display Mode</label>
                    <select id="mode-select">
                        <option value="widget">Widget Mode (OBS)</option>
                        <option value="chat">Chat Mode</option>
                        <option value="streamer">Streamer Mode (Chat + Activity Split)</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>Theme</label>
                    <select id="theme-select">
                        <!-- filled from /api/themes by main.js -->
                        <option value="dark-pill">Dark Pill</option>
                    </select>
                </div>
                <a class="editor-link" href="/editor.html" target="_blank" rel="noopener">Open Theme Editor &rarr;</a>
                <div class="setting-row">
                    <label>Background</label>
                    <select id="bg-select">
                        <option value="transparent">Transparent (For OBS)</option>
                        <option value="dark">Dark Mode (For Testing/Monitors)</option>
                    </select>
                </div>
            </div>
        </details>
        <details class="settings-section" data-section="chat">
            <summary>Chat &amp; Activity</summary>
            <div class="settings-section-body">
                <div class="setting-row">
                    <label>Highlight Mentions</label>
                    <select id="mention-select">
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>Activity Position</label>
                    <select id="pos-select">
                        <option value="right">Right Side</option>
                        <option value="left">Left Side</option>
                    </select>
                </div>
            </div>
        </details>
        <div class="hint">Press 'T' to close</div>
    </div>

    <button id="scroll-btn">⬇ New Messages Below</button>

    <div id="main-container">
        <div id="chatbox"></div>
        <div id="activity-feed">
            <div id="status-bar">
                <div id="status-live"></div>
                <button id="settings-btn" title="Widget Settings (T)" aria-label="Widget Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
            <div class="activity-header">Recent Activity</div>
            <div id="activity-list"></div>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>

</html>
