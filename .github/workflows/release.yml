name: Release

# Runs when you push a version tag (e.g. `git tag v2.1.0 && git push origin v2.1.0`).
# Bump `version` in Cargo.toml ([workspace.package]) and src-tauri/tauri.conf.json first.
# Can also be run manually.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            suffix: linux-x64
          - os: windows-latest
            suffix: windows-x64
          - os: macos-latest
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies (WebKitGTK for the Tauri window)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p multichat-core

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build desktop app (installers / bundles)
        run: cargo tauri build

      - name: Build headless server
        run: cargo build --release -p multichat-core --bin multichat-server

      - name: Collect artifacts
        run: |
          mkdir -p out
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          cp "target/release/multichat-server$ext" "out/multichat-server-${{ matrix.suffix }}$ext"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The plain exe runs without installing (needs the WebView2 runtime, built into Windows 10/11).
            cp target/release/multi-chat.exe "out/Multi-Chat-portable-${{ matrix.suffix }}.exe"
          fi
          shopt -s nullglob
          for f in target/release/bundle/{nsis/*.exe,msi/*.msi,dmg/*.dmg,appimage/*.AppImage,deb/*.deb}; do cp "$f" out/; done
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist-artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
